version: '3.8'

services:
  # n8n lokalny (identyczny z VPS)
  n8n-local:
    image: n8nio/n8n:latest  # Najnowsza wersja (auto-update)
    container_name: n8n-local
    user: "1000:1000"
    ports:
      - "5679:5678"  # Lokalny port
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=local123
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679
      - N8N_ENCRYPTION_KEY=local-encryption-key-dev
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    volumes:
      - ./n8n-data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - n8n-local-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --spider --tries=1 --timeout=10 http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # n8n-mcp lokalny (prebuilt image)
  n8n-mcp-local:
    image: ghcr.io/czlonkowski/n8n-mcp:latest  # Prebuilt image twórcy
    container_name: n8n-mcp-local
    ports:
      - "3001:3000"  # Lokalny port
    environment:
      - NODE_ENV=development
      - N8N_MODE=true
      - MCP_MODE=http
      - N8N_API_URL=http://n8n-local:5678/api/v1
      - N8N_API_KEY=local-api-key-dev
      - MCP_AUTH_TOKEN=local-mcp-token
      - AUTH_TOKEN=local-mcp-token
      - LOG_LEVEL=debug
      - USE_FIXED_HTTP=true
      - NODE_DB_PATH=/app/data/nodes.db
      - REBUILD_ON_START=false
    volumes:
      - ./n8n-mcp-data:/app/data
      - ./logs:/app/logs
    networks:
      - n8n-local-network
    depends_on:
      n8n-local:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  n8n-local-network:
    driver: bridge

volumes:
  n8n_local_data:
    driver: local
  n8n_mcp_local_data:
    driver: local
